name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  APP_NAME: dirdiffz
  ZIG_VERSION: 0.16.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            artifact: linux-x86_64

          - os: ubuntu-latest
            target: aarch64-linux
            artifact: linux-aarch64

          - os: macos-latest
            target: x86_64-macos
            artifact: macos-x86_64

          - os: macos-latest
            target: aarch64-macos
            artifact: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Dtarget=${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          archive="${APP_NAME}-${{ matrix.artifact }}"

          tar -C zig-out/bin \
            -czf "dist/${archive}.tar.gz" \
            "${APP_NAME}"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${archive}.tar.gz" > "dist/${archive}.tar.gz.sha256"
          else
            shasum -a 256 "dist/${archive}.tar.gz" > "dist/${archive}.tar.gz.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: find dist -type f -maxdepth 1 -print

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes

  homebrew:
    needs: release
    runs-on: ubuntu-latest
  
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
  
      - name: Read checksums
        id: sha
        shell: bash
        run: |
          echo "maca=$(cut -d' ' -f1 dist/dirdiffz-macos-aarch64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
          echo "linuxa=$(cut -d' ' -f1 dist/dirdiffz-linux-aarch64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
          echo "macx=$(cut -d' ' -f1 dist/dirdiffz-macos-x86_64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
          echo "linuxx=$(cut -d' ' -f1 dist/dirdiffz-linux-x86_64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
  
      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: vakata/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
  
      - name: Update formula
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          MAC_ARM_SHA: ${{ steps.sha.outputs.maca }}
          MAC_X86_SHA: ${{ steps.sha.outputs.macx }}
          LINUX_ARM_SHA: ${{ steps.sha.outputs.linuxa }}
          LINUX_X86_SHA: ${{ steps.sha.outputs.linuxx }}
        run: |
          VERSION="${VERSION}"

          cat > tap/Formula/dirdiffz.rb <<EOF
          class Dirdiffz < Formula
            desc "Terminal directory diff tool"
            homepage "https://github.com/vakata/dirdiffz"
            version "${VERSION}"
          
            on_macos do
              on_arm do
                url "https://github.com/vakata/dirdiffz/releases/download/${VERSION}/dirdiffz-macos-aarch64.tar.gz"
                sha256 "${MAC_ARM_SHA}"
              end
          
              on_intel do
                url "https://github.com/vakata/dirdiffz/releases/download/${VERSION}/dirdiffz-macos-x86_64.tar.gz"
                sha256 "${MAC_X86_SHA}"
              end
            end
          
            on_linux do
              on_arm do
                url "https://github.com/vakata/dirdiffz/releases/download/${VERSION}/dirdiffz-linux-aarch64.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              end
          
              on_intel do
                url "https://github.com/vakata/dirdiffz/releases/download/${VERSION}/dirdiffz-linux-x86_64.tar.gz"
                sha256 "${LINUX_X86_SHA}"
              end
            end
          
            def install
              bin.install "dirdiffz"
            end
          
            test do
              system "#{bin}/dirdiffz", "--help"
            end
          end
          EOF

      - name: Commit formula
        working-directory: tap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
  
          git add Formula/dirdiffz.rb
          git commit -m "dirdiffz ${GITHUB_REF_NAME}"
          git push

  aur:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout packaging definition
        uses: actions/checkout@v7

      - name: Prepare package metadata
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a version tag such as 0.1.5" >&2
            exit 1
          }
          mkdir -p aur
          cp packaging/aur/PKGBUILD aur/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$TAG/" aur/PKGBUILD
          curl --fail --location --retry 3 --output source.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          checksum="$(sha256sum source.tar.gz | cut -d' ' -f1)"
          sed -i "s/^sha256sums=.*/sha256sums=('$checksum')/" aur/PKGBUILD
          docker run --rm -v "$PWD/aur:/work:ro" -w /work archlinux:base-devel \
            bash -c "useradd -m builder && su builder -c 'cd /work && makepkg --printsrcinfo'" \
            > aur/.SRCINFO

      - name: Configure AUR SSH key
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo 'Set the AUR_SSH_PRIVATE_KEY repository secret before publishing.' >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF

      - name: Publish to AUR
        shell: bash
        run: |
          set -euo pipefail
          git clone ssh://aur@aur.archlinux.org/dirdiffz.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo 'AUR package is already up to date.'
            exit 0
          fi
          git commit -m "Update dirdiffz to ${GITHUB_REF_NAME}"
          git push origin master
