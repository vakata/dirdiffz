name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  APP_NAME: dirdiffz
  ZIG_VERSION: 0.16.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            artifact: linux-x86_64

          - os: ubuntu-latest
            target: aarch64-linux
            artifact: linux-aarch64

          - os: macos-latest
            target: x86_64-macos
            artifact: macos-x86_64

          - os: macos-latest
            target: aarch64-macos
            artifact: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Dtarget=${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist

          archive="${APP_NAME}-${{ matrix.artifact }}"

          mkdir "$archive"
          cp "zig-out/bin/${APP_NAME}" "$archive/"

          tar -czf "dist/${archive}.tar.gz" "$archive"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${archive}.tar.gz" > "dist/${archive}.tar.gz.sha256"
          else
            shasum -a 256 "dist/${archive}.tar.gz" > "dist/${archive}.tar.gz.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: find dist -type f -maxdepth 1 -print

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --verify-tag \
            --generate-notes
